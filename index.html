<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우주전함 샌드박스 시뮬레이션 - 기획서 라이브러리</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge">SB</span>
        <div>
          <strong>우주전함 샌드박스 시뮬레이션</strong>
          <p>Game Design Library</p>
        </div>
      </div>
      <div class="meta">
        <span>기획 문서 뷰어</span>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h2>목차</h2>
        <nav id="toc"></nav>
      </aside>

      <section class="content-wrap">
        <div class="hero-card">
          <h1>우주전함 기획 문서 라이브러리</h1>
          <p>
            게임소개 문서와 시스템기획 문서를 분리해 관리하는 라이브러리 페이지입니다.
            소개/컨셉과 실제 데이터 설계를 문서 전환으로 빠르게 오갈 수 있습니다.
          </p>
          <div class="hero-tags">
            <span>#Sandbox</span>
            <span>#우주전함</span>
            <span>#자동전투전략</span>
            <span>#내부운영</span>
          </div>
          <div class="doc-switch" id="docSwitch">
            <a data-doc="intro" href="?doc=intro">게임소개 문서</a>
            <a data-doc="system" href="?doc=system">시스템기획 문서</a>
          </div>
          <div class="quick-pages">
            <a href="game_hud.html" target="_blank" rel="noopener">통합 HUD 보기</a>
            <a href="전함_외부.html" target="_blank" rel="noopener">외부 전투 UI 보기</a>
          </div>
        </div>
        <article id="doc" class="document"></article>
      </section>
    </main>

    <script>
      const docMap = {
        intro: '게임소개_기획.md',
        system: '시스템기획_데이터.md'
      };
      const selectedDoc = new URLSearchParams(window.location.search).get('doc') === 'system' ? 'system' : 'intro';
      const markdownPath = `${encodeURI(docMap[selectedDoc])}?v=${Date.now()}`;

      const inline = (text) =>
        text
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');

      const slugify = (text) =>
        text
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9가-힣\s-]/g, '')
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-');

      function parseMarkdown(md) {
        const lines = md.split('\n');
        let html = '';
        let inUl = false;
        let inOl = false;
        let inTable = false;

        const closeLists = () => {
          if (inUl) {
            html += '</ul>';
            inUl = false;
          }
          if (inOl) {
            html += '</ol>';
            inOl = false;
          }
        };

        const closeTable = () => {
          if (inTable) {
            html += '</tbody></table>';
            inTable = false;
          }
        };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];

          if (!line.trim()) {
            closeLists();
            closeTable();
            continue;
          }

          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            closeLists();
            closeTable();
            const level = heading[1].length;
            const text = heading[2].trim();
            const id = slugify(text);
            html += `<h${level} id="${id}">${inline(text)}</h${level}>`;
            continue;
          }

          if (/^---+$/.test(line.trim())) {
            closeLists();
            closeTable();
            html += '<hr />';
            continue;
          }

          if (/^\|.+\|$/.test(line.trim())) {
            closeLists();
            const cells = line
              .trim()
              .slice(1, -1)
              .split('|')
              .map((c) => c.trim());

            const isSeparator = cells.every((c) => /^:?-{2,}:?$/.test(c));
            if (isSeparator) continue;

            if (!inTable) {
              html += '<table><tbody>';
              inTable = true;
            }

            const isHeader = i > 0 && /^\|\s*[-:| ]+\|$/.test(lines[i + 1] || '');
            html += `<tr>${cells
              .map((cell) => (isHeader ? `<th>${inline(cell)}</th>` : `<td>${inline(cell)}</td>`))
              .join('')}</tr>`;
            continue;
          }

          const ulMatch = line.match(/^\s*[-*]\s+(.+)$/);
          if (ulMatch) {
            closeTable();
            if (inOl) {
              html += '</ol>';
              inOl = false;
            }
            if (!inUl) {
              html += '<ul>';
              inUl = true;
            }
            html += `<li>${inline(ulMatch[1])}</li>`;
            continue;
          }

          const olMatch = line.match(/^\s*\d+\.\s+(.+)$/);
          if (olMatch) {
            closeTable();
            if (inUl) {
              html += '</ul>';
              inUl = false;
            }
            if (!inOl) {
              html += '<ol>';
              inOl = true;
            }
            html += `<li>${inline(olMatch[1])}</li>`;
            continue;
          }

          closeLists();
          closeTable();
          html += `<p>${inline(line.trim())}</p>`;
        }

        closeLists();
        closeTable();
        return html;
      }

      function buildToc(container) {
        const tocEl = document.getElementById('toc');
        const headings = container.querySelectorAll('h2, h3, h4');
        const frag = document.createDocumentFragment();

        headings.forEach((h) => {
          const a = document.createElement('a');
          a.href = `#${h.id}`;
          a.textContent = h.textContent;
          a.className = `toc-level-${h.tagName.toLowerCase()}`;
          frag.appendChild(a);
        });

        tocEl.innerHTML = '';
        tocEl.appendChild(frag);
      }

      const switchEl = document.getElementById('docSwitch');
      if (switchEl) {
        switchEl.querySelectorAll('a').forEach((a) => {
          if (a.dataset.doc === selectedDoc) a.classList.add('active');
        });
      }

      fetch(markdownPath, { cache: 'no-store' })
        .then((res) => res.text())
        .then((md) => {
          const doc = document.getElementById('doc');
          doc.innerHTML = parseMarkdown(md);
          buildToc(doc);
        })
        .catch(() => {
          document.getElementById('doc').innerHTML =
            '<p class="error">문서를 불러오지 못했습니다. 새로고침(Ctrl+F5) 또는 로컬 서버 실행 상태를 확인해주세요.</p>';
        });
    </script>
  </body>
</html>
